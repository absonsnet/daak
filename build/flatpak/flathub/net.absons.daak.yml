app-id: net.absons.daak
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
  - org.freedesktop.Sdk.Extension.node24
command: daak

finish-args:
  # Network access for email sync
  - --share=network
  # IPC is required for X11 and Wayland
  - --share=ipc
  # Display access
  - --socket=wayland
  - --socket=fallback-x11
  # GPU access for hardware acceleration
  - --device=dri
  # Sleep/wake detection for sync management
  - --system-talk-name=org.freedesktop.login1

modules:
  - name: daak
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/golang/bin:/usr/lib/sdk/node24/bin
      env:
        GOROOT: /usr/lib/sdk/golang
        GOPATH: /run/build/daak/go
        GOCACHE: /run/build/daak/go-cache
        GO111MODULE: 'on'
        CGO_ENABLED: '1'
        npm_config_cache: /run/build/daak/flatpak-node/npm-cache
        npm_config_offline: 'true'

    build-commands:
      # Install frontend dependencies from offline cache
      - cd frontend && npm install --offline --legacy-peer-deps

      # Build frontend
      - cd frontend && npm run build

      # Build the Go binary using vendored modules (no ldflags needed;
      # OAuth credentials are loaded at runtime from the shim binary).
      # Tags: desktop (Wails runtime), webkit2_41 (GTK webkit API), production (embedded assets)
      - go build -mod=vendor -tags desktop,webkit2_41,production -ldflags "-w -s" -o daak

      # Install binary
      - install -Dm755 daak /app/bin/daak

      # Install OAuth credentials shim binary
      - install -Dm755 daak-creds /app/lib/daak/daak-creds

      # Install desktop file with correct app ID
      - install -Dm644 build/linux/daak.desktop /app/share/applications/net.absons.daak.desktop

      # Install themed icons with correct app ID (32-256 + scalable). A lone
      # 256 is skipped by hicolor MinSize=64 at small lookup sizes (#395).
      - |
        for sz in 32 48 64 128 256; do
          install -Dm644 "build/linux/icons/${sz}x${sz}/net.absons.daak.png" \
            "/app/share/icons/hicolor/${sz}x${sz}/apps/net.absons.daak.png"
        done
      - install -Dm644 build/linux/icons/scalable/net.absons.daak.svg /app/share/icons/hicolor/scalable/apps/net.absons.daak.svg

      # Install metainfo (AppStream metadata)
      - install -Dm644 build/flatpak/net.absons.daak.metainfo.xml /app/share/metainfo/net.absons.daak.metainfo.xml

    sources:
      # Application source code (tag and commit updated by calculate-hashes.sh)
      - type: git
        url: https://github.com/absonsnet/daak.git
        tag: v0.7.36
        commit: b34fb39fb007d8c88884cd2e8bf64c04ccd53aba

      # Go module vendoring (generated by flatpak-go-mod, offline)
      - go.mod.yml

      # npm package vendoring (generated by flatpak-node-generator, offline)
      - node-sources.json

      # OAuth credentials shim binary (x86_64)
      - type: file
        url: https://github.com/absonsnet/daak/releases/download/v0.7.36/flathub-build-env-v0.7.36-linux-x86_64
        sha256: 47e0ec8692367c63cfbc0ec5c396b11310c995366b0af41c72583280fe271ce9
        dest-filename: daak-creds
        only-arches:
          - x86_64

      # OAuth credentials shim binary (aarch64)
      - type: file
        url: https://github.com/absonsnet/daak/releases/download/v0.7.36/flathub-build-env-v0.7.36-linux-aarch64
        sha256: 8f50796b23951a0ab9e1538df580bada288301a776eee26dd22275e77b415275
        dest-filename: daak-creds
        only-arches:
          - aarch64
